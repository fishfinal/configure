# API short description.
title: SWAGGER API DOCUMENTATION.

# API version.
version: v1.2.3

# API schemes.
schemes:
  - http
  - https

# API consumes.
consumes:
  - application/json

# API produces.
produces:
  - application/json

# Security definitions
security_definitions:
  app_token_header:
    type: apiKey
    name: X-Access-Token
    in: header
  app_token_query:
    type: apiKey
    name: token
    in: query
  client_token_header:
    type: apiKey
    name: X-Access-Token
    in: header
  client_token_query:
    type: apiKey
    name: token
    in: query




